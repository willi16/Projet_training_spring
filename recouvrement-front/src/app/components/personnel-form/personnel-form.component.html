<div class="max-w-3xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
      {{ isEditMode ? ' Modifier le Personnel' : ' Nouveau Personnel' }}
    </h1>
    <a routerLink="/personnels" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
       Retour à la liste
    </a>
  </div>

  @if (isLoading) {
    <div class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500"></div>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
      
      @if (error) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">{{ error }}</div>
      }

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Matricule -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Matricule</label>
          <input type="text" formControlName="matricule" 
                 class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                 [class.border-red-500]="form.get('matricule')?.invalid && form.get('matricule')?.touched">
        </div>

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nom d'utilisateur</label>
          <input type="text" formControlName="username" 
                 class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                 [class.border-red-500]="form.get('username')?.invalid && form.get('username')?.touched">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Mot de passe {{ isEditMode ? '(laisser vide si inchangé)' : '' }}
          </label>
          <input type="password" formControlName="password" 
                 class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Role -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Rôle</label>
          <select formControlName="role" 
                  class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="ADMIN">Administrateur</option>
            <option value="DIRECTEUR">Directeur</option>
            <option value="COMPTABLE">Comptable</option>
            <option value="PARENT">Parent</option>
          </select>
        </div>

        <!-- Nom -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nom</label>
          <input type="text" formControlName="nom" 
                 class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Prénom -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prénom</label>
          <input type="text" formControlName="prenom" 
                 class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Email -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
          <input type="email" formControlName="email" 
                 class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Actif -->
        <div class="md:col-span-2 flex items-center gap-2">
          <input type="checkbox" id="actif" formControlName="actif" class="w-5 h-5 text-blue-600 rounded">
          <label for="actif" class="text-gray-700 dark:text-gray-300 font-medium">Compte Actif</label>
        </div>
      </div>

      <div class="pt-4 flex justify-end gap-3">
        <a routerLink="/personnels" class="px-4 py-2 text-gray-600 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">
          Annuler
        </a>
        <button type="submit" [disabled]="isLoading || form.invalid"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow disabled:opacity-50 disabled:cursor-not-allowed transition">
          {{ isLoading ? 'Sauvegarde...' : (isEditMode ? 'Mettre à jour' : 'Créer') }}
        </button>
      </div>
    </form>
  }
</div>
